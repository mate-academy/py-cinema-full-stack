services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./backend/media:/vol/web/media
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - local_db:${PGDATA}

  frontend:
    build:
      context: frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - frontend/.env
    restart: on-failure
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
      - db

volumes:
  local_db:
