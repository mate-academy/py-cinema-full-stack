services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"   # зовнішній порт 8001, внутрішній 8000
    volumes:
      - ./backend:/app
      - ./backend/media:/vol/web/media
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    ports:
      - "5433:5432"   # зовнішній порт 5433, внутрішній 5432
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # фронтенд буде доступний на localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # 👈 окремий volume для node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data:
  media:
